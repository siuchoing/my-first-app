<ion-content>
  <div class="flex-center">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Create Account</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
          <ion-list>
            <!-- Full Name Input -->
            <ion-item class="ion-margin-bottom">
              <ion-button fill="clear" slot="start" class="no-bg-btn">
                <ion-icon name="person"></ion-icon>
              </ion-button>
              <ion-input
                type="text"
                aria-label="Full name"
                placeholder="Full name"
                fill="outline"
                formControlName="name"
                [errorText]="nameError"
              ></ion-input>
            </ion-item>

            <!-- Email Input -->
            <ion-item class="ion-margin-bottom">
              <ion-button fill="clear" slot="start" class="no-bg-btn">
                <ion-icon name="mail"></ion-icon>
              </ion-button>
              <ion-input
                type="email"
                aria-label="Enter email"
                placeholder="Enter email"
                fill="outline"
                formControlName="email"
                aria-label="Enter email"
                placeholder="Enter email"
                fill="outline"
                [errorText]="emailError"
              ></ion-input>
            </ion-item>

            <!-- Mobile Phone -->
            <ion-item class="ion-margin-bottom">
              <ion-button fill="clear" slot="start" class="no-bg-btn">
                   <ion-icon name="call-outline"></ion-icon>
              </ion-button>
              <ion-input
                type="tel"
                aria-label="Enter phone"
                placeholder="Enter phone"
                fill="outline"
                formControlName="phone"
                aria-label="Enter phone"
                placeholder="Enter phone"
                fill="outline"
                [errorText]="phoneError"
              ></ion-input>
            </ion-item>
            
            <!-- Password Input -->
            <ion-item class="ion-margin-bottom">
              <ion-button fill="clear" slot="start" class="no-bg-btn">
                <ion-icon name="lock-closed"></ion-icon>
              </ion-button>
              <ion-input
                name="password"
                fill="outline"
                type="password"
                aria-label="Enter password"
                placeholder="Enter password"
                formControlName="password"
                [errorText]="passwordError"
              >
                <ion-input-password-toggle
                  slot="end"
                ></ion-input-password-toggle>
              </ion-input>
            </ion-item>

            <!-- Confirm Password Input -->
            <ion-item class="ion-margin-bottom">
              <ion-button fill="clear" slot="start" class="no-bg-btn">
                <ion-icon name="shield-checkmark"></ion-icon>
              </ion-button>
              <ion-input
                name="confirmPassword"
                fill="outline"
                type="password"
                aria-label="Confirm password"
                placeholder="Enter password"
                formControlName="confirmPassword"
                [errorText]="confirmPasswordError"
              >
                <ion-input-password-toggle
                  slot="end"
                ></ion-input-password-toggle>
              </ion-input>
            </ion-item>
            
            <!-- Address Input -->
            <ion-item class="ion-margin-bottom">
              <ion-button fill="clear" slot="start" class="no-bg-btn">
                <ion-icon name="home-outline"></ion-icon>
              </ion-button>
              <ion-input
                fill="outline"
                type="text"
                formControlName="address"
                aria-label="Enter address"
                placeholder="Enter address"
                [errorText]="addressError"
              >
              </ion-input>
            </ion-item>
            
            <ion-item class="ion-margin-bottom">
            <ion-button fill="clear" slot="start" class="no-bg-btn">
              <ion-icon name="accessibility-outline"></ion-icon>
            </ion-button>
            
            <ion-select 
              fill="outline" 
              formControlName="gender"
              aria-label="Select gender"
              placeholder="Select gender"
              [errorText]="genderError"
            >
              <ion-select-option value="male">Male</ion-select-option>
              <ion-select-option value="female">Female</ion-select-option>
              <ion-select-option value="other">Other</ion-select-option>
            </ion-select>
          </ion-item>

            <!-- Register Button -->
            <ion-button
              type="submit"
              expand="block"
              class="auth-submit-btn ion-margin-top"
              color="dark"
              fill="solid"
              [disabled]="registerForm.invalid"
            >
              Sign Up
            </ion-button>
          </ion-list>
        </form>

        <!-- "or" 分隔線區塊 -->
        <div class="ion-or-divider">or sign up with</div>

        <div class="social-login-container">
          <!-- 1. Google 註冊按鈕 -->
          <ion-button
            fill="clear"
            expand="block"
            class="modern-social-btn google"
            (click)="socialRegister('Google')"
          >
            <ion-icon name="logo-google"></ion-icon>
          </ion-button>

          <!-- 2. Apple 註冊按鈕 -->
          <ion-button
            fill="clear"
            expand="block"
            class="modern-social-btn apple"
            (click)="socialRegister('Apple')"
          >
            <ion-icon name="logo-apple"></ion-icon>
          </ion-button>

          <!-- 3. Facebook 註冊按鈕 -->
          <ion-button
            fill="clear"
            expand="block"
            class="modern-social-btn facebook"
            (click)="socialRegister('Facebook')"
          >
            <ion-icon name="logo-facebook"></ion-icon>
          </ion-button>
        </div>

        <!-- 返回登入連結 -->
        <div class="ion-text-center ion-margin-top">
          <p class="login-redirect-text">
            Already have an account?
            <a href="/login" class="login-link">Sign in</a>
          </p>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
